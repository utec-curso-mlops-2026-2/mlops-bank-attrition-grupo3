name: CI de la plantilla

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Instalación, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Instalar paquete y herramientas
        run: python -m pip install -e '.[dev]'
      - name: Revisar estilo e imports
        run: python -m ruff check .
      - name: Ejecutar pruebas
        run: |
          set +e
          python -m pytest --junitxml=test-results/pytest.xml
          pytest_exit_code=$?
          set -e
          if [ "$pytest_exit_code" -eq 5 ]; then
            echo '::notice::Pruebas pendientes: el equipo todavía no ha añadido casos.'
            echo 'Pruebas pendientes. Solo se verificaron la instalación y el estilo.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$pytest_exit_code"
          fi
      - name: Conservar resultado de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ github.sha }}
          path: test-results/pytest.xml
          if-no-files-found: warn
