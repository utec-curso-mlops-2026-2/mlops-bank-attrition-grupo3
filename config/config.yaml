data:
  raw_path: data/raw/202611          # luego: s3://<bucket>/raw/202611
  data_version: "202611"
  clientes_train: train_clientes_sample.csv
  req_train: train_requerimientos_sample.csv
  clientes_oot: oot_clientes_sample.csv
  req_oot: oot_requerimientos_sample.csv
  id_col: ID_CORRELATIVO
  target_col: ATTRITION

features:
  output_path: data/features/202611
  n_meses_req: 5
  corte:
    train: 202407
    oot: 202408
  top_productos: [Producto 20, Producto 07, Producto 18, Producto 21, Producto 17]
  top_submotivos: [Submotivo 125, Submotivo 157, Submotivo 144, Submotivo 132, Submotivo 88]
  tipos_req: [Reclamo, Solicitud]
  dictamenes: [PROCEDE TOTAL, NO PROCEDE, PROCEDE PARCIAL, SIN_DICTAMEN]
  lag_prefixes: [SDO_ACTIVO, FLG_SEGURO, NRO_ACCES_CANAL1, NRO_ACCES_CANAL2, NRO_ACCES_CANAL3, NRO_ENTID_SSFF, FLG_SDO_OTSSFF]

split:
  test_size: 0.3
  random_state: 42

train:
  selection_metric: test_auc        # criterio explícito para elegir el mejor modelo
  threshold: 0.5                    # umbral para la matriz de confusión
  models:
    logreg: {C: 1.0, max_iter: 2000, class_weight: balanced}
    random_forest: {n_estimators: 300, max_depth: 8, min_samples_leaf: 50, class_weight: balanced, n_jobs: -1, random_state: 42}
    lightgbm: {n_estimators: 400, learning_rate: 0.05, num_leaves: 31, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, is_unbalance: true, random_state: 42, verbose: -1}

mlflow:
  model_name: workspace.bank_attrition.attrition_model
  min_auc_test: 0.70